# ボートレース公式サイトの直前情報・オッズを締切前に取得し、非公開リポジトリに保存する。
# このリポジトリにはプログラムだけを置き、取得したデータは置かない。
# 時刻はUTC。開催時間帯に30分おきに起動をかけ、1本だけが動き続ける（JST 21:45 まで、最長5.6時間で次に引き継ぐ）。
name: collect-odds
on:
  schedule:
    # GitHubの予約実行は数時間遅れたり飛ばされたりするので、開催時間帯（JST 8:10〜21:40）に30分おきに起動をかける。
    # 同時に動くのは1本だけ（下の concurrency）。動いている間に来た起動は順番待ちになり、前の分が終わるとすぐ引き継ぐ。
    # 実測で予約は6〜10時間遅れることがあるため、夜間も含めて終日30分おきに合図を出す。開催時間外に届いた分は翌朝まで待機して引き継ぐ。
    - cron: "10,40 * * * *"
  push:
    paths: [".trigger"]     # このファイルを更新すると手動で走る（1行目が数字ならその時間、なければ約10分）
  workflow_dispatch:
    inputs:
      hours:
        description: "動かす時間（時間単位）。空欄なら自動（昼は21:45まで収集、夜は翌朝まで待機）"
        default: ""
        required: false
# 同時に2本走らせない（公式サイトへのアクセスを1秒1回までに保つため）。後から来た分は順番待ちになる。
concurrency:
  group: collect-odds
  cancel-in-progress: false
permissions:
  contents: read
  actions: write      # 終了時に次の実行を自分で予約するため
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml
      - name: 取得と保存（15分ごとに非公開リポジトリへ保存）
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          date +%s > /tmp/collect_start
          if [ -z "$DATA_TOKEN" ]; then echo "DATA_TOKEN が登録されていません"; exit 1; fi
          # 動かす時間: 手動指定があればそれ。なければ JST 21:45 まで（最長5.6時間）。開催時間外なら何もしない。
          H="${{ github.event.inputs.hours }}"
          if [ -z "$H" ] && [ "${{ github.event_name }}" = "push" ]; then
            H=$(head -n1 .trigger | grep -E '^[0-9]+(\.[0-9]+)?$' || true)
            if [ -z "$H" ] && [ "$(head -n1 .trigger)" != "auto" ]; then H=0.15; fi
          fi
          if [ -z "$H" ]; then
            NOW=$(( 10#$(TZ=Asia/Tokyo date +%H) * 60 + 10#$(TZ=Asia/Tokyo date +%M) ))
            LEFT=$(( 21 * 60 + 45 - NOW ))
            if [ "$NOW" -lt 450 ] || [ "$LEFT" -lt 5 ]; then
              # 夜間: 翌朝7:30まで待機する（1回の待機は最長5時間。終わると次の実行に引き継ぐ）。公式サイトにはアクセスしない。
              if [ "$NOW" -lt 450 ]; then W=$(( 450 - NOW )); else W=$(( 450 + 1440 - NOW )); fi
              if [ "$W" -gt 300 ]; then W=300; fi
              echo "開催時間外のため ${W} 分待機します（その間に過去の確定オッズを少しずつ取得）"
              T0=$(date +%s)
              if [ "$W" -gt 20 ] && git clone --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/daisukenakagawa-blip/kyouteiAI.git" store; then
                git -C store config user.name "odds-collector"
                git -C store config user.email "odds-collector@users.noreply.github.com"
                if [ -f store/engine/scripts/backfill_odds.py ]; then
                  # 2秒に1回まで。朝の収集開始の10分前には止める。
                  python store/engine/scripts/backfill_odds.py --minutes $(( W - 10 )) --since 2024-01-01 --interval 2 || echo "backfill が異常終了"
                fi
              fi
              REST=$(( W * 60 - ( $(date +%s) - T0 ) ))
              if [ "$REST" -gt 0 ]; then sleep "$REST"; fi
              echo 1 > /tmp/chain_ok
              exit 0
            fi
            if [ "$LEFT" -gt 336 ]; then LEFT=336; fi
            H=$(awk "BEGIN{printf \"%.2f\", $LEFT/60}")
          fi
          echo "動かす時間: ${H}h"
          git clone --depth 1 "https://x-access-token:${DATA_TOKEN}@github.com/daisukenakagawa-blip/kyouteiAI.git" store
          git -C store config user.name "odds-collector"
          git -C store config user.email "odds-collector@users.noreply.github.com"
          if [ -f store/engine/scripts/cloud_run.py ]; then
            # 予測エンジンあり: 取得と同時に予測・判定・台帳記録まで行う（保存は判定のたび＋15分ごとにプログラム側で行う）
            pip install -q lightgbm pandas numpy scikit-learn lhafile
            python store/engine/scripts/cloud_run.py --hours "$H" --before 5 1 || echo "cloud_run が異常終了"
            for p in data/odds ledger hist/inc; do [ -e "store/$p" ] && git -C store add "$p"; done
            git -C store commit -q -m "odds $(date -u +%F_%H%M)" || true
            git -C store pull -q --rebase || true
            git -C store push -q || true
            exit 0
          fi
          save() {
            mkdir -p store/data/odds
            # オッズは追加のみ。取得ログと予定表は実行ごとに別名で保存する（後の実行が前の記録を上書きしないため）。
            if [ -d out/odds ]; then (cd out/odds && tar cf - --exclude=fetch_log.jsonl --exclude=schedule.json .) | (cd store/data/odds && tar xf -); fi
            for d in out/odds/*/; do
              [ -d "$d" ] || continue
              day=$(basename "$d"); mkdir -p "store/data/odds/$day"
              [ -f "$d/fetch_log.jsonl" ] && cp "$d/fetch_log.jsonl" "store/data/odds/$day/fetch_log_${GITHUB_RUN_ID}.jsonl"
              [ -f "$d/schedule.json" ] && cp "$d/schedule.json" "store/data/odds/$day/schedule_${GITHUB_RUN_ID}.json"
            done
            git -C store add data/odds
            git -C store commit -q -m "odds $(date -u +%F_%H%M)" || return 0
            git -C store pull -q --rebase || true
            git -C store push -q
          }
          python collector.py --hours "$H" --before 5 1 --out out/odds &
          PID=$!
          N=0
          while kill -0 "$PID" 2>/dev/null; do
            sleep 30; N=$((N + 1))
            if [ $((N % 30)) -eq 0 ]; then save || echo "保存に失敗（次回に再試行）"; fi
          done
          wait "$PID" || echo "collector が異常終了"
          save

      - name: 次の実行を予約（昼は収集を、夜は待機を、途切れないように自分で引き継ぐ）
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(( 10#$(TZ=Asia/Tokyo date +%H) * 60 + 10#$(TZ=Asia/Tokyo date +%M) ))
          RAN=$(( $(date +%s) - $(cat /tmp/collect_start 2>/dev/null || date +%s) ))
          # すぐ終わった実行（失敗など）からは予約しない。空回りの連鎖を防ぐ。
          # 10分以上働いた実行か、夜間の待機を終えた実行だけが次を予約する（失敗の空回りを防ぐ）
          if [ "$RAN" -ge 600 ] || [ -f /tmp/chain_ok ]; then
            gh workflow run collect.yml --repo "${{ github.repository }}" --ref main && echo "次の実行を予約しました"
          else
            echo "すぐ終わった実行のため予約しません"
          fi

